services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy
      POSTGRES_DB: policy_intelligence
    ports:
      # 5433 on the host to avoid colliding with a local PostgreSQL on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policy_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: .
    # The image runs migrations and seeds the demo policy before serving, so a cold
    # `docker compose up` produces a working system rather than an empty one.
    env_file: .env
    environment:
      # Inside the compose network the database is `db:5432`, not the host's 5433.
      DATABASE_URL: postgresql+psycopg://policy:policy@db:5432/policy_intelligence
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
