# Evaluation set.
#
# Labels are split by cost (plan.md §2.2). `expected_pages` and `answerable` are cheap
# and already unlock Recall@k, MRR and abstention metrics -- which is everything the
# week-3 retrieval experiments need. `gold_answer` is expensive hand-verification and
# lags behind; null means "not labelled yet", not "no answer".
#
# Rules:
#   - Every entry is verified against the source PDF by a human. LLM-generated
#     candidates are a starting point, never a label.
#   - The set is frozen before an experiment runs. A metric that moved because the
#     questions changed is not a result.
#   - Keep unanswerable questions at roughly 20% of the set. Without them, abstention
#     cannot be measured and the threshold cannot be calibrated.
#
# Target: 50 questions by end of week 3.

version: 1
set_name: seed-week1

questions:
  - id: q001
    question: "What is the waiting period for pre-existing diseases?"
    policy: acme-health-guard
    answerable: true
    expected_pages: [2]
    expected_section: "4. Waiting Periods > 4.3 Pre-existing disease waiting period"
    gold_answer: null
    notes: "The headline question. Thirty-six months of continuous coverage."

  - id: q002
    question: "Is there a waiting period in the first month of the policy?"
    policy: acme-health-guard
    answerable: true
    expected_pages: [2]
    expected_section: "4. Waiting Periods > 4.1 Initial waiting period"
    gold_answer: null
    notes: "Paraphrase test -- the document says 'thirty days', not 'first month'."

  - id: q003
    question: "How long must I wait before a listed surgery is covered?"
    policy: acme-health-guard
    answerable: true
    expected_pages: [2]
    expected_section: "4. Waiting Periods > 4.2 Specific waiting period"
    gold_answer: null
    notes: "Twenty-four months. Must not be confused with q001's thirty-six."

  - id: q004
    question: "Does this policy cover a surgery after six months?"
    policy: acme-health-guard
    answerable: true
    expected_pages: [2]
    expected_section: "4. Waiting Periods"
    gold_answer: null
    notes: >
      The brief's own example question. The correct behaviour is conditional: it depends
      on whether the condition is pre-existing, listed, or neither. An answer that says
      a flat yes or no is wrong even if it cites the right page.

  - id: q005
    question: "Is cosmetic surgery covered?"
    policy: acme-health-guard
    answerable: true
    expected_pages: [3]
    expected_section: "5. Exclusions > 5.1 Cosmetic surgery"
    gold_answer: null

  - id: q006
    question: "What happens if I take a room above my eligible category?"
    policy: acme-health-guard
    answerable: true
    expected_pages: [3]
    expected_section: "5. Exclusions > 5.2 Room rent"
    gold_answer: null

  - id: q007
    question: "What counts as a hospital under this policy?"
    policy: acme-health-guard
    answerable: true
    expected_pages: [1]
    expected_section: "1. Definitions"
    gold_answer: null

  - id: q008
    question: "How many months before the policy start date does a pre-existing condition have to be diagnosed?"
    policy: acme-health-guard
    answerable: true
    expected_pages: [1]
    expected_section: "1. Definitions > 1.1 Pre-existing Disease"
    gold_answer: null
    notes: >
      Forty-eight months. Deliberately adjacent to q001's thirty-six: a system that
      retrieves 'the waiting period section' for both is failing at precision.

  - id: q009
    question: "What is the premium for a family of four?"
    policy: acme-health-guard
    answerable: false
    expected_pages: []
    expected_section: null
    gold_answer: null
    notes: "Not in the wording. Must abstain, not estimate from market knowledge."

  - id: q010
    question: "Is dental treatment covered under this policy?"
    policy: acme-health-guard
    answerable: false
    expected_pages: []
    expected_section: null
    gold_answer: null
    notes: >
      No dental clause in this document. Tempting to answer from general knowledge of
      health policies -- the correct behaviour is abstention.

  - id: q011
    question: "Will my claim for a knee replacement be approved?"
    policy: acme-health-guard
    answerable: false
    expected_pages: []
    expected_section: null
    gold_answer: null
    notes: >
      Out of scope by design: the system is not the claims authority. It should explain
      what the wording says about waiting periods and decline to predict the decision.
